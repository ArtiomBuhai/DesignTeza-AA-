<style>
  :root {
    --panel-sidebar-width: 208px;
    --panel-sidebar-bg: #ffffff;
    --panel-sidebar-border: #dbe4f0;
    --panel-sidebar-text: #5f728e;
    --panel-sidebar-active-bg: #e9f0ff;
    --panel-sidebar-active-text: #255fdb;
    --panel-ui-base-font-size: 80%;
  }

  html {
    font-size: var(--panel-ui-base-font-size) !important;
  }

  body:not([data-theme="dark"]) {
    background: #f3f6fb !important;
    color: #1e293b;
  }

  .dashboard,
  .dashboard-layout {
    display: flex;
    min-height: 100vh;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  .sidebar {
    width: var(--panel-sidebar-width) !important;
    background: var(--panel-sidebar-bg) !important;
    border-right: 1px solid var(--panel-sidebar-border) !important;
    padding: 16px 12px 14px !important;
    position: fixed !important;
    top: 0;
    bottom: 0;
    left: 0;
    overflow-y: auto;
    scrollbar-gutter: stable;
    box-shadow: 6px 0 18px rgba(15, 23, 42, 0.03);
    z-index: 50;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif !important;
  }

  .sidebar-logo {
    display: block;
    font-size: 2.2rem !important;
    font-weight: 800 !important;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--panel-sidebar-active-text) !important;
    margin-bottom: 16px !important;
    text-decoration: none;
  }

  .sidebar-logo a {
    color: inherit;
    text-decoration: none;
  }

  .sidebar-nav {
    display: flex !important;
    flex-direction: column !important;
    gap: 4px !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .sidebar-nav a {
    display: flex;
    align-items: center;
    min-height: 38px;
    padding: 8px 10px !important;
    margin: 0 !important;
    border-radius: 10px !important;
    color: var(--panel-sidebar-text) !important;
    text-decoration: none;
    font-size: 0.96rem !important;
    font-weight: 600 !important;
    line-height: 1.2 !important;
    transition: background 0.18s ease, color 0.18s ease;
  }

  .sidebar-nav a:hover,
  .sidebar-nav a.active {
    background: var(--panel-sidebar-active-bg) !important;
    color: var(--panel-sidebar-active-text) !important;
    font-weight: 600 !important;
  }

  .main,
  .main-content {
    margin-left: var(--panel-sidebar-width) !important;
    width: calc(100% - var(--panel-sidebar-width)) !important;
    max-width: none !important;
    min-width: 0;
    min-height: 100vh;
    flex: 1 1 auto;
    padding: 18px 22px !important;
    background: transparent !important;
    box-sizing: border-box;
  }

  .page-container {
    max-width: none !important;
    width: 100% !important;
    margin: 0 !important;
  }

  .main-content > .page-container,
  .main > .page-container,
  .main-content .page-container,
  .main .page-container {
    min-width: 0;
    max-width: none !important;
    width: 100% !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
  }

  /* Global compact density while keeping the same visual language */
  .header {
    margin-bottom: 20px !important;
    gap: 10px !important;
  }

  .header-left h1,
  .header-left h2,
  .header h1,
  .header h2 {
    font-size: clamp(1.7rem, 2.2vw, 2.1rem) !important;
    line-height: 1.15;
    margin-bottom: 4px !important;
  }

  .date {
    font-size: 0.98rem !important;
  }

  .header-right,
  .user-info,
  .user {
    display: flex !important;
    align-items: center !important;
    gap: 10px !important;
    min-width: 0;
    white-space: nowrap;
  }

  .lang-form {
    display: flex;
    align-items: center;
    margin: 0;
  }

  .lang-select {
    min-width: 110px;
    max-width: 110px;
    height: 36px;
    border: 1px solid #d1d9e6;
    border-radius: 10px;
    background: #ffffff;
    color: #1e293b;
    font-size: 0.92rem;
    padding: 0 10px;
  }

  .avatar {
    width: 38px !important;
    height: 38px !important;
  }

  .search-bar {
    width: 240px !important;
    min-height: 40px;
    border-radius: 10px !important;
    padding: 6px 10px !important;
  }

  .search-bar input {
    font-size: 0.94rem !important;
  }

  .card,
  .stat-card,
  .meetings-section,
  .submission-card,
  .result-card,
  .metric-card,
  .column,
  .task-card,
  .activity-item {
    border-radius: 14px !important;
  }

  .card,
  .stat-card,
  .meetings-section,
  .submission-card,
  .result-card,
  .metric-card,
  .column {
    padding: 16px !important;
  }

  .stat-icon {
    width: 48px !important;
    height: 48px !important;
    border-radius: 12px !important;
    font-size: 1.4rem !important;
  }

  .big-number {
    font-size: 2rem !important;
    line-height: 1.1;
  }

  .card-title,
  .section-title,
  .column-title,
  .section-header h2 {
    font-size: clamp(1.2rem, 1.8vw, 1.6rem) !important;
    line-height: 1.2;
    margin-bottom: 12px !important;
  }

  .stats-row,
  .form-row,
  .activities,
  .meetings-list,
  .requests-list,
  .chips {
    gap: 10px !important;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"],
  input[type="date"],
  input[type="time"],
  input[type="number"],
  select,
  textarea {
    font-size: 0.95rem !important;
    border-radius: 10px !important;
    padding: 9px 11px !important;
  }

  .btn,
  .btn-primary,
  .btn-outline,
  .primary-btn,
  .check-btn,
  .add-btn,
  .add-submission-btn,
  .save-btn,
  .edit-btn,
  .mute-btn,
  button[type="submit"] {
    border-radius: 10px !important;
    padding: 8px 12px !important;
    font-size: 0.92rem !important;
    min-height: 34px;
    white-space: nowrap;
  }

  .task-meta,
  .task-description,
  .chat-last-msg,
  .task-text,
  .about-text {
    font-size: 0.92rem !important;
    line-height: 1.35;
  }

  .task-comments {
    margin-top: 8px;
    border-top: 1px dashed #dbe4f0;
    padding-top: 8px;
  }

  .task-comments-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
  }

  .task-comment-item {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 6px 8px;
  }

  .task-comment-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 3px;
    font-size: 0.79rem;
    color: #64748b;
  }

  .task-comment-head strong {
    flex: 1;
    min-width: 0;
    color: #0f172a;
    font-size: 0.82rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .task-comment-head span {
    flex: 0 0 auto;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .task-comment-body {
    font-size: 0.86rem;
    color: #1e293b;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .task-comment-empty {
    color: #94a3b8;
    font-size: 0.84rem;
  }

  .task-comment-form {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px;
    align-items: center;
  }

  .task-comment-form input[type="text"] {
    flex: 1;
    min-width: 0;
    margin: 0;
  }

  .task-comment-form button {
    border: none;
    background: #2563eb;
    color: #fff;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.84rem;
    cursor: pointer;
    min-height: 30px;
    min-width: 112px;
    white-space: nowrap;
  }

  .month-title {
    font-size: 1.15rem !important;
  }

  .month-stats {
    font-size: 0.88rem !important;
  }

  @media (max-width: 1200px) {
    :root {
      --panel-sidebar-width: 186px;
    }

    .sidebar-logo {
      font-size: 2rem !important;
    }

    .main,
    .main-content {
      padding: 14px 16px !important;
    }

    .search-bar {
      width: 210px !important;
    }
  }

  @media (max-width: 900px) {
    :root {
      --panel-sidebar-width: 186px;
    }

    .main,
    .main-content {
      padding: 10px 12px !important;
    }
  }

  @media (max-width: 560px) {
    .task-comment-head {
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .task-comment-head span {
      white-space: normal;
      color: #8a99ad;
      font-size: 0.76rem;
    }
  }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ro.js"></script>
<script>
  (function () {
    function setupLocalizedFormValidation() {
      const lang = ((document.documentElement.getAttribute("lang") || "ro").slice(0, 2) || "ro").toLowerCase();
      const messages = {
        ro: {
          required: "Completați acest câmp.",
          email: "Introduceți o adresă de email validă.",
          url: "Introduceți un URL valid.",
          number: "Introduceți un număr valid.",
          pattern: "Valoarea introdusă nu este validă.",
          generic: "Valoarea introdusă nu este validă.",
        },
        ru: {
          required: "Заполните это поле.",
          email: "Введите корректный адрес электронной почты.",
          url: "Введите корректный URL.",
          number: "Введите корректное число.",
          pattern: "Введенное значение некорректно.",
          generic: "Введенное значение некорректно.",
        },
        en: {
          required: "Please fill out this field.",
          email: "Please enter a valid email address.",
          url: "Please enter a valid URL.",
          number: "Please enter a valid number.",
          pattern: "The entered value is invalid.",
          generic: "The entered value is invalid.",
        },
      };
      const i18n = messages[lang] || messages.ro;

      function clearCustomValidity(el) {
        if (!el || typeof el.setCustomValidity !== "function") return;
        el.setCustomValidity("");
      }

      function applyCustomValidity(el) {
        if (!el || typeof el.setCustomValidity !== "function" || !el.validity) return;
        el.setCustomValidity("");

        if (el.validity.valueMissing) {
          el.setCustomValidity(i18n.required);
          return;
        }
        if (el.validity.typeMismatch) {
          if (el.type === "email") {
            el.setCustomValidity(i18n.email);
            return;
          }
          if (el.type === "url") {
            el.setCustomValidity(i18n.url);
            return;
          }
          el.setCustomValidity(i18n.generic);
          return;
        }
        if (el.validity.badInput && el.type === "number") {
          el.setCustomValidity(i18n.number);
          return;
        }
        if (el.validity.patternMismatch) {
          el.setCustomValidity(i18n.pattern);
        }
      }

      document.addEventListener(
        "invalid",
        function (event) {
          applyCustomValidity(event.target);
        },
        true
      );

      document.addEventListener(
        "input",
        function (event) {
          clearCustomValidity(event.target);
        },
        true
      );

      document.addEventListener(
        "change",
        function (event) {
          clearCustomValidity(event.target);
        },
        true
      );
    }

    function setupLocalizedDateInputs() {
      const lang = ((document.documentElement.getAttribute("lang") || "ro").slice(0, 2) || "ro").toLowerCase();
      const placeholderByLang = {
        ro: "zz.ll.aaaa",
        ru: "дд.мм.гггг",
        en: "dd.mm.yyyy",
      };

      if (window.flatpickr) {
        if (lang === "ru" && window.flatpickr.l10ns && window.flatpickr.l10ns.ru) {
          window.flatpickr.localize(window.flatpickr.l10ns.ru);
        } else if (lang === "ro" && window.flatpickr.l10ns && window.flatpickr.l10ns.ro) {
          window.flatpickr.localize(window.flatpickr.l10ns.ro);
        } else if (window.flatpickr.l10ns && window.flatpickr.l10ns.default) {
          window.flatpickr.localize(window.flatpickr.l10ns.default);
        }
      }

      document.querySelectorAll('input[type="date"]').forEach(function (dateInput) {
        dateInput.setAttribute("lang", lang);

        if (!window.flatpickr) return;
        if (dateInput.dataset.i18nDateReady === "1") return;
        if (dateInput.dataset.nativeDate === "1") return;
        dateInput.dataset.i18nDateReady = "1";

        const instance = window.flatpickr(dateInput, {
          locale: lang === "en" ? "default" : lang,
          altInput: true,
          altFormat: "d.m.Y",
          dateFormat: "Y-m-d",
          allowInput: true,
          clickOpens: true,
          disableMobile: true,
          minDate: dateInput.min || null,
          maxDate: dateInput.max || null,
        });

        const alt = instance && instance.altInput;
        if (alt) {
          alt.className = dateInput.className;
          alt.style.cssText = dateInput.style.cssText;
          alt.placeholder = placeholderByLang[lang] || placeholderByLang.ro;
          alt.setAttribute("lang", lang);
        }
      });
    }

    setupLocalizedFormValidation();

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", setupLocalizedDateInputs);
    } else {
      setupLocalizedDateInputs();
    }
  })();
</script>
